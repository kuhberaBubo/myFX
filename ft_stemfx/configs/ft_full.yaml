# Experiment ft_full: pretrained StemFX, encoder trained from epoch 1
# (encoder lr = learning_rate x encoder_lr_multiplier), early stopping on val loss.
#
#   python ft_stemfx/train.py --config ft_stemfx/configs/ft_full.yaml \
#       data.root=/content/run_20k \
#       train.checkpoint_dir=/content/drive/MyDrive/myFX/ckpt/ft_full \
#       train.log_dir=/content/drive/MyDrive/myFX/logs/ft_full
#
# Dotted CLI overrides take precedence over this file.

data:
  root: null                  # REQUIRED. folder containing train.jsonl / val.jsonl / param_info/
  train_file: train.jsonl
  val_file: val.jsonl
  sample_rate: 44100
  clip_start_sec: 0.0         # 15 s clips: play 0-10 s, silent tail 10-15 s
  clip_duration: 10.0         # encoder was trained on 10 s
  dummy_level_db: -60.0       # RMS of the dummy vocals/bass/drums noise (must not be silence)
  max_seq_len: 512            # keep 512: positional-encoding buffer is in the checkpoint
  num_workers: 2              # Colab: 2
  max_train_samples: null     # e.g. 200 for a quick test
  max_val_samples: null
  skip_missing_audio: false   # true for local smoke tests on a partial copy

model:
  pretrained_checkpoint: null # null -> download paper checkpoint (barry-mir/stemfx-bsfilm)
  dropout: 0.1

train:
  batch_size: 16
  num_epochs: 30              # upper bound; early stopping ends it
  learning_rate: 1.0e-4
  encoder_lr_multiplier: 0.1  # encoder lr 1e-5 (pretrained), decoder 1e-4
  freeze_encoder: false       # encoder trained from epoch 1
  unfreeze_at_epoch: null
  weight_decay: 0.01
  clip_grad_norm: 1.0
  warmup_steps: 500
  gradient_accumulation_steps: 1
  lambda_mse: 20.0
  no_value_head: true
  log_dir: logs/ft_full
  checkpoint_dir: checkpoints/ft_full
  log_interval: 50
  save_interval: 1000          # no numbered snapshots (Drive space); latest + best only
  device: cuda
  resume: auto
  seed: 42
  amp: auto                   # bf16 on L4/A100 (~2x faster); off on T4
  cache_embeddings: false
  best_metric: loss
  early_stop_patience: 3
  early_stop_min_delta: 0.001
