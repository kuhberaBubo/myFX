[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemfx"
version = "0.2.0"
description = "Mixing style representation learning via autoregressive FX chain prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Barry Cheng", email = "im31132@gmail.com"}]
keywords = ["audio", "mixing", "style-transfer", "music-information-retrieval"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "huggingface_hub>=0.20",
    "multiafx>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
training = [
    "tensorboard",
    "matplotlib",
    "tqdm",
    "librosa",
]
evaluation = [
    "matplotlib",
    "tqdm",
    "faiss-cpu",
]

[project.urls]
Homepage = "https://github.com/barry-mir/stemfx"
Documentation = "https://github.com/barry-mir/stemfx/blob/main/docs"
Issues = "https://github.com/barry-mir/stemfx/issues"

[tool.setuptools.packages.find]
include = ["stemfx*"]
exclude = ["tests*", "data*", "pipeline*", "evaluate*", "docs*"]

[tool.setuptools.package-data]
"stemfx.third_party" = ["NOTICE", "LICENSE.msst"]
"stemfx.third_party.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
