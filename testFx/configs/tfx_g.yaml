# testFX-G: guitar encoder (band x time axial transformer + time-varying FiLM from
# frame-level pedal features + global pedal tokens), trained from scratch,
# StemFX decoder warm-started from the paper checkpoint.
#
#   python testFx/train_tfx.py --config testFx/configs/tfx_g.yaml \
#       data.root=/content/run_20k \
#       train.checkpoint_dir=/content/drive/MyDrive/myFX/ckpt/tfx_g \
#       train.log_dir=/content/drive/MyDrive/myFX/logs/tfx_g

data:
  root: null
  train_file: train.jsonl
  val_file: val.jsonl
  sample_rate: 44100
  clip_start_sec: 0.0
  clip_duration: 15.0         # full clip: 10 s playing + 5 s tail (delay / reverb)
  max_seq_len: 512
  num_workers: 2
  max_train_samples: null
  max_val_samples: null
  skip_missing_audio: false

model:
  pretrained_checkpoint: null # StemFX checkpoint for the decoder (null -> HF download)
  decoder_init: stemfx        # stemfx | random
  memory_gate_init: 0.1       # memory = gate * LayerNorm(encoder out); small start, learnable (see tfx_model.TestFX)
  dropout: 0.1
  encoder:
    kind: g
    d_model: 192              # same size as the StemFX encoder transformer
    n_blocks: 4
    n_heads: 6
    ffn: 768
    dropout: 0.1
    n_mels: 128
    split: 20                 # 11 overlapping mel bands
    overlap: 10
    band_time_pool: 2         # 23 ms frames -> 46 ms inside the transformer
    memory_time_pool: 4       # -> ~5.4 tokens/s per band in the decoder memory
    play_sec: 10.0            # where the tail starts (global tail features)

train:
  batch_size: 16
  num_epochs: 40              # upper bound; early stopping ends it
  learning_rate: 1.0e-4       # decoder
  new_lr_multiplier: 3.0      # new encoder -> 3e-4
  pretrained_encoder_lr_multiplier: 0.1
  weight_decay: 0.01
  clip_grad_norm: 1.0
  warmup_steps: 1000
  gradient_accumulation_steps: 1
  lambda_mse: 20.0
  no_value_head: true
  log_dir: logs/tfx_g
  checkpoint_dir: checkpoints/tfx_g
  log_interval: 50
  save_interval: 1000          # no numbered snapshots (Drive space); latest + best only
  device: cuda
  resume: auto
  seed: 42
  amp: auto
  best_metric: loss
  early_stop_patience: 4
  early_stop_min_delta: 0.001
